name = "omininote-collab"
main = "worker.js"
compatibility_date = "2024-11-06"

# Metadata-only join registry. Create the namespace once with:
#   npx wrangler kv namespace create COLLAB
# then paste the printed id below.
[[kv_namespaces]]
binding = "COLLAB"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: serve from https://collab.omininote.com instead of the
# *.workers.dev subdomain. Requires omininote.com to be on Cloudflare DNS.
# [[routes]]
# pattern = "collab.omininote.com"
# custom_domain = true
