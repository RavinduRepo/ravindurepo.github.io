name = "omininote-collab-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# Create with: npx wrangler kv namespace create COLLAB_ROOMS
# Then paste the id below.
[[kv_namespaces]]
binding = "COLLAB_ROOMS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional custom domain in Cloudflare dashboard:
# collab-api.omininote.com → this worker
