<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in OminiNote</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 80px auto; padding: 0 24px; color: #1a1a1a; line-height: 1.7; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: 8px; }
    p { color: #444; }
    a.btn { display: inline-block; margin: 8px 6px; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    a.primary { background: #1a1a1a; color: #fff; }
    a.secondary { border: 1px solid #ccc; color: #1a1a1a; }
    a.secondary:hover { background: #f5f5f5; }
    #link-preview { display: none; }
    .muted { color: #888; font-size: 0.9rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1 id="dl-title">Open in OminiNote</h1>
  <p id="dl-desc">If this was a share or invite link, OminiNote should open automatically when installed.</p>
  <p>
    <a id="open-app" class="btn primary" href="#" style="display:none">Open in OminiNote</a>
    <a class="btn secondary" href="https://github.com/RavinduRepo/OminiNote/releases">Download app</a>
    <a class="btn secondary" href="/">Home</a>
  </p>
  <p class="muted"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
  <code id="link-preview"></code>
  <script src="/deeplink.js"></script>
  <script>
    // Non-deep-link 404: soft message after script runs.
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        if (!document.documentElement.classList.contains('deeplink-page')) {
          var t = document.getElementById('dl-title');
          var d = document.getElementById('dl-desc');
          if (t) t.textContent = 'Page not found';
          if (d) d.textContent = 'That URL does not exist on omininote.com.';
        }
      }, 0);
    });
  </script>
</body>
</html>
